name: Tests

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet10-${{ hashFiles('.github/workflows/tests.yml', '*.sln*', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet10-

      - name: Restore Packages
        run: dotnet restore osu.Native.sln

      - name: Compile
        run: dotnet build -c Release --no-restore osu.Native.sln

      - name: Test
        run: dotnet test osu.Native.sln -c Release --no-build --logger "trx;LogFileName=TestResults.trx" -- NUnit.ConsoleOut=0

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#cancelled
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: osu-native-test-results
          path: ${{github.workspace}}/**/TestResults/TestResults.trx

  test-results:
    name: Test results
    runs-on: ubuntu-latest
    # we want to wait for the `tests` job to complete, but run regardless of whether it succeeds or fails
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-not-requiring-successful-dependent-jobs
    if: ${{ !cancelled() }}
    needs: tests
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: osu-native-test-results*
          merge-multiple: true

      - name: Add test results summary to workflow run
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Results
          path: "**/*.trx"
          reporter: dotnet-trx
          list-suites: 'failed'
          list-tests: 'failed'
          use-actions-summary: 'true'