name: Native artifact comparison

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  EXECUTION_ID: execution-${{ github.run_id }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  native-diff:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '!diff' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Check permissions
        run: |
          PERMISSION="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"

          case "$PERMISSION" in
              write|maintain|admin) ;;
              *) exit 1 ;;
          esac

      - name: Get commit hashes
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '"base=\(.base.sha)\nhead=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      - name: Create comment
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: ${{ env.EXECUTION_ID }}
          message: |
            Native artifact comparison queued -- please wait! (${{ env.RUN_URL }})

            *This comment will update on completion*

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compare
        id: diff
        env:
          REF_BRANCH: ${{ steps.pr.outputs.base }}
        run: ./generate_cabinet_diff.sh

      - name: Update comment on success
        if: ${{ needs.compare.result == 'success' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: ${{ env.EXECUTION_ID }}
          mode: recreate
          message: |
            #### Native artifact comparison

            Size: `${{ steps.diff.outputs.ref_size }}` → `${{ steps.diff.outputs.local_size }}` bytes (`${{ steps.diff.outputs.local_size - steps.diff.outputs.ref_size }}`)

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
            ---
            Runner log: ${{ env.RUN_URL }}

      - name: Update comment on failure
        if: ${{ failure() || needs.compare.result == 'failure' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: ${{ env.EXECUTION_ID }}
          mode: recreate
          message: |
            Native diff failed: ${{ env.RUN_URL }}

      - name: Update comment on cancellation
        if: ${{ failure() || needs.compare.result == 'failure' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: ${{ env.EXECUTION_ID }}
          mode: delete
          message: '.' # Appears to be required by this action for non-error status code.